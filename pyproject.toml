[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "camusdb-py"
version = "0.1.0"
description = "Python DB-API 2.0 driver for CamusDB, with a native asyncio interface"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CamusDB" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]
keywords = ["camusdb", "database", "dbapi", "sql", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Typing :: Typed",
]

[project.optional-dependencies]
http2 = ["httpx[http2]>=0.27,<1"]

[project.urls]
Homepage = "https://github.com/camusdb/camusdb"
Repository = "https://github.com/camusdb/camusdb-py"
Issues = "https://github.com/camusdb/camusdb-py/issues"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/camusdb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a CamusDB server; set CAMUSDB_TEST_ENDPOINT to run",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# The formatter sets the line length; a long string or comment is left as it is.
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/camusdb"]
